[workspace]
members = [
    ".",
    "crates/core",
    "crates/opengl",
    "crates/software",
]

[workspace.dependencies]
# tests & benchmarks
gungraun = "0.17.0"
picoview = { git = "https://github.com/blepfx/picoview", rev = "5657ae49f15e8d76fb696995f235e5a99d1e2100" }
image = { version = "0.25.5", default-features = false, features = ["webp"] }
yansi = "1.0"

# feature(software)
bumpalo = { version = "3.17", features = ["boxed", "collections"] }

# feature(opengl)
glow = { git = "https://github.com/grovesNL/glow/", branch = "main" }

[profile.bench]
debug = true

[package]
name = "picodraw"
version = "1.0.0"
edition = "2024"
description = "A smol gpu graphics library"
license = "MIT OR Apache-2.0"
exclude = [
    "tests/drawtest", 
    "tests/drawtest.rs"
]

[dependencies]
picodraw-core = { path = "crates/core", default-features = false }
picodraw-opengl = { path = "crates/opengl", optional = true }
picodraw-software = { path = "crates/software", optional = true }

[dev-dependencies]
gungraun = { workspace = true }
picoview = { workspace = true }
image = { workspace = true }
yansi = { workspace = true }

[features]
default = ["opengl", "software"]
opengl = ["dep:picodraw-opengl"]
software = ["dep:picodraw-software"]

[[example]]
name = "opengl_circles"

[[example]]
name = "opengl_stress"

[[bench]]
name = "software"
harness = false
required-features = ["software"]
